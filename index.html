<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bounty Heat Board</title>
<meta name="description" content="An opportunity board for Solana bounties that scores how crowded each listing is before you spend a weekend on it.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="meta-theme-color" content="#FAF9FC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237A3BEE'/%3E%3Crect x='3' y='7' width='3' height='2' rx='1' fill='%23fff'/%3E%3Crect x='7' y='7' width='3' height='2' rx='1' fill='%23fff' opacity='.7'/%3E%3Crect x='11' y='7' width='2' height='2' rx='1' fill='%23fff' opacity='.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
/* Pre-paint theme + language restore. Inline on purpose: it must run before first paint
   so the page never flashes the wrong theme. Every storage access is guarded. */
(function () {
  'use strict';
  var theme = null, lang = null;
  try { theme = window.localStorage.getItem('bh.theme'); } catch (e) { theme = null; }
  try { lang = window.localStorage.getItem('bh.lang'); } catch (e) { lang = null; }
  var root = document.documentElement;
  if (theme === 'light' || theme === 'dark') { root.setAttribute('data-theme', theme); }
  root.lang = (lang === 'en') ? 'en' : 'th';
  var dark = theme === 'dark' || (theme !== 'light' &&
    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var meta = document.getElementById('meta-theme-color');
  if (meta) { meta.setAttribute('content', dark ? '#0B0A11' : '#FAF9FC'); }
}());
</script>
</head>
<body id="top">

<a class="skip-link" href="#listings" data-i18n="skip">ข้ามไปที่รายการงาน</a>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="#top">BOUNTY<span class="wordmark__accent">HEAT</span></a>

    <nav class="site-nav" aria-label="Sections" data-i18n-aria-label="nav.label">
      <a href="#listings" data-i18n="nav.board">กระดานงาน</a>
      <a href="#playbook" data-i18n="nav.playbook">คู่มือ</a>
      <a href="#ev-calculator" data-i18n="nav.calc">เครื่องคำนวณ</a>
    </nav>

    <div class="site-header__tools">
      <div class="seg lang-seg" role="radiogroup" aria-label="Language" data-i18n-aria-label="langLabel" id="lang-toggle">
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-lang" value="th" checked><span lang="th">ไทย</span></label>
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-lang" value="en"><span lang="en">EN</span></label>
      </div>
      <div class="seg theme-seg" role="radiogroup" aria-label="Colour theme" data-i18n-aria-label="theme.label" data-theme-toggle>
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-theme-a" value="light"><span data-i18n="theme.light">สว่าง</span></label>
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-theme-a" value="system" checked><span data-i18n="theme.system">ตามระบบ</span></label>
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-theme-a" value="dark"><span data-i18n="theme.dark">มืด</span></label>
      </div>
    </div>
  </div>
</header>

<div id="boot-error" class="boot-error" hidden role="alert"></div>

<main id="main">

  <!-- ============================ HERO ============================ -->
  <section class="hero band" id="hero">
    <div class="wrap hero__inner">
      <p class="label-micro hero__eyebrow"><span class="hero__dot" aria-hidden="true"></span><span id="hero-eyebrow"></span></p>

      <h1 class="hero__h1" id="hero-h1"></h1>

      <p class="hero__sub" id="hero-sub"></p>
      <p class="hero__sub-alt" id="hero-sub-alt"></p>

      <div class="hero__counter">
        <p class="label-micro" id="counter-label"></p>
        <span id="paidCounter" class="num hero__counter-value" aria-live="off">&nbsp;</span>
        <p class="hero__counter-reality" id="counter-reality"></p>
        <p class="hero__counter-sub" id="counter-sub"></p>
      </div>

      <ul class="hero__pills" id="hero-pills"></ul>

      <div class="hero__ctas">
        <a class="btn btn--primary" id="cta-primary" href="https://superteam.fun/earn/" target="_blank" rel="noopener noreferrer"></a>
        <a class="btn btn--ghost" id="cta-secondary" href="#listings"></a>
      </div>
      <p class="hero__cta-note" id="cta-note"></p>

      <div class="ticker-wrap">
        <h2 class="sr-only" id="ticker-label"></h2>
        <div class="ticker" aria-labelledby="ticker-label"><div class="ticker__track" id="ticker-track"></div></div>
        <ul class="ticker-static" id="ticker-static"></ul>
      </div>
    </div>
  </section>

  <!-- ================== CONTROLS + BOARD (one sticky scope) ================== -->
  <div class="board-shell">
  <div class="controls" id="controls">
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="Listing type" data-i18n-aria-label="tabs.label" id="tabs"></div>

      <div class="filters" id="filters">
        <div class="search">
          <label class="sr-only" for="q" data-i18n="filters.searchLabel">ค้นหา</label>
          <svg class="search__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M7 1.5a5.5 5.5 0 1 1-3.6 9.66l-2.2 2.2a.75.75 0 0 1-1.06-1.06l2.2-2.2A5.5 5.5 0 0 1 7 1.5Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" fill="currentColor"/></svg>
          <input type="search" id="q" autocomplete="off" spellcheck="false">
        </div>

        <button type="button" class="btn-filters" id="filters-open" aria-expanded="false" aria-controls="sheet">
          <span data-i18n="filters.button">ตัวกรอง</span><span class="btn-filters__count num" id="filters-count" hidden>0</span>
        </button>

        <div class="filters__advanced" id="filters-advanced">
          <div class="chiprow" id="chips-skill" role="group" aria-label="Skill" data-i18n-aria-label="filters.skill"></div>
          <div class="chiprow" id="chips-misc" role="group" aria-label="Quick filters" data-i18n-aria-label="filters.quick"></div>
          <div class="selects" id="selects"></div>
        </div>

        <div class="sortwrap">
          <label class="sr-only" for="sort" data-i18n="filters.sortLabel">เรียงลำดับ</label>
          <select id="sort" class="select"></select>
        </div>

        <p class="resultline num" id="resultline" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <!-- ============================ BOARD ============================ -->
  <section class="board-section">
    <div class="wrap board" id="board">

      <aside class="rail" id="rail">
        <div class="calc-host" id="calc-host">
          <section id="calc" class="calc-shell" aria-label="Expected value calculator" data-i18n-aria-label="calc.region">
            <p class="label-micro calc-eyebrow" id="calc-eyebrow"></p>
            <div id="ev-calculator"></div>
          </section>
        </div>

        <details class="legend" id="legend">
          <summary class="legend__summary"><span id="legend-summary-text"></span></summary>
          <div class="legend__body">
            <ul class="legend__list" id="legend-list"></ul>
            <p class="legend__method" id="legend-method"></p>
            <button type="button" class="chip legend__shortcut" id="legend-shortcut" aria-pressed="false"></button>
          </div>
        </details>
      </aside>

      <div class="feed" id="feed">
        <div class="live" id="live">
          <button type="button" class="btn btn--ghost btn--sm" id="live-refresh"></button>
          <p class="live__msg" id="live-msg" role="status"></p>
          <div class="skeletons" id="live-skeletons" hidden aria-hidden="true">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </div>

        <div id="listings" class="feed__list"></div>

        <div class="empty" id="empty" hidden>
          <div class="empty__icon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <h3 id="empty-title"></h3>
          <p class="empty__body" id="empty-body"></p>
          <p class="label-micro" id="empty-active-label"></p>
          <div class="chiprow" id="empty-chips"></div>
          <div class="empty__actions">
            <button type="button" class="btn btn--solid" id="empty-clear"></button>
            <button type="button" class="btn btn--ghost" id="empty-uncrowd" hidden></button>
          </div>
          <p class="empty__hint" id="empty-hint"></p>
        </div>
      </div>

    </div>
  </section>
  </div><!-- /.board-shell -->

  <!-- ========================== PLAYBOOK =========================== -->
  <section class="playbook band" id="playbook">
    <div class="wrap">
      <header class="playbook__head">
        <p class="label-micro" id="playbook-eyebrow"></p>
        <h2 id="playbook-title"></h2>
        <p class="playbook__sub" id="playbook-sub"></p>
      </header>

      <h3 class="playbook__h3" id="pb-steps-h"></h3>
      <ol class="steps" id="pb-steps"></ol>

      <h3 class="playbook__h3" id="pb-plays-h"></h3>
      <div class="plays" id="pb-plays"></div>

      <h3 class="playbook__h3" id="pb-mistakes-h"></h3>
      <ul class="mistakes" id="pb-mistakes"></ul>

      <h3 class="playbook__h3" id="pb-faq-h"></h3>
      <div class="faq" id="pb-faq"></div>

      <p class="playbook__foot" id="playbook-foot"></p>
    </div>
  </section>

</main>

<footer class="site-footer band">
  <div class="wrap">
    <div class="site-footer__grid">
      <div class="site-footer__brand">
        <span class="wordmark">BOUNTY<span class="wordmark__accent">HEAT</span></span>
        <p id="footer-blurb"></p>
        <p class="num" id="footer-meta"></p>
      </div>
      <nav class="site-footer__col" aria-label="Browse" data-i18n-aria-label="footer.browse">
        <p class="label-micro" data-i18n="footer.browse">ดูงาน</p>
        <ul id="footer-browse"></ul>
      </nav>
      <nav class="site-footer__col" aria-label="Learn" data-i18n-aria-label="footer.learn">
        <p class="label-micro" data-i18n="footer.learn">เรียนรู้</p>
        <ul id="footer-learn"></ul>
      </nav>
      <nav class="site-footer__col" aria-label="About" data-i18n-aria-label="footer.about">
        <p class="label-micro" data-i18n="footer.about">เกี่ยวกับ</p>
        <ul id="footer-about"></ul>
      </nav>
    </div>

    <div class="site-footer__bar">
      <div class="site-footer__legal">
        <p id="footer-copy"></p>
        <p class="site-footer__disclaimer" id="footer-disclaimer"></p>
        <p class="site-footer__sources" id="footer-sources"></p>
      </div>
      <div class="seg theme-seg" role="radiogroup" aria-label="Colour theme" data-i18n-aria-label="theme.label" data-theme-toggle>
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-theme-b" value="light"><span data-i18n="theme.light">สว่าง</span></label>
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-theme-b" value="system" checked><span data-i18n="theme.system">ตามระบบ</span></label>
        <label class="seg__opt"><input type="radio" class="sr-only" name="bh-theme-b" value="dark"><span data-i18n="theme.dark">มืด</span></label>
      </div>
    </div>
  </div>
</footer>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet__head">
    <h2 class="sheet__title" id="sheet-title"></h2>
    <button type="button" class="sheet__close" id="sheet-close" aria-label="Close" data-i18n-aria-label="sheet.close">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false" width="16" height="16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet__body" id="sheet-body"></div>
  <div class="sheet__actions">
    <button type="button" class="btn btn--solid" id="sheet-apply"></button>
    <button type="button" class="btn btn--ghost" id="sheet-clear"></button>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/playbook.js"></script>
<script src="assets/js/calculator.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
